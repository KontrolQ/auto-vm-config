[project]
name = "auto-vm-config"
version = "0.1.0"
description = "Build and unattended-install QEMU virtual machines from a configuration"
requires-python = ">=3.11"
dependencies = [
    "cli-widgets @ git+https://github.com/KontrolQ/cli-widgets@main",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "RUF",
    "PERF",
    "TID",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"
