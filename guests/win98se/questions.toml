[[question]]
key = "owner_name"
question = "Registered owner"
kind = "entry"
required = true
limit = 30
placeholder = "the name setup registers the installation to"
section = "NameAndOrg"
field = "Name"

[[question]]
key = "organisation"
question = "Organisation"
kind = "entry"
required = true
default = "Home"
limit = 30
placeholder = "setup asks for this itself if it is left empty"
section = "NameAndOrg"
field = "Org"

[[question]]
key = "computer_name"
question = "Computer name"
kind = "entry"
required = true
limit = 15
placeholder = "letters, digits and hyphens"
pattern = "^[A-Za-z0-9-]{1,15}$"
section = "Network"
field = "ComputerName"

[[question]]
key = "workgroup"
question = "Workgroup"
kind = "entry"
required = true
default = "WORKGROUP"
limit = 15
pattern = "^[A-Za-z0-9-]{1,15}$"
section = "Network"
field = "Workgroup"

[[question]]
key = "computer_description"
question = "Computer description"
kind = "entry"
required = true
default = "Windows 98"
limit = 48
placeholder = "shown to other machines on the network"
section = "Network"
field = "Description"

[[question]]
key = "install_directory"
question = "Install directory"
kind = "entry"
required = true
limit = 63
default = "C:\\WINDOWS"
section = "Setup"
field = "InstallDir"

[[question]]
key = "time_zone"
question = "Time zone"
kind = "choice"
section = "Setup"
field = "TimeZone"
